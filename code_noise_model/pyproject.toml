[project]
name = "noise-model"
version = "0.1.0"
description = "Design and model-recovery tools for implicit adaptation noise models."
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.1",
  "scipy==1.16.0",
  "matplotlib==3.8.3",
  "scikit-learn==1.5.1",
  "statsmodels==0.14.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
